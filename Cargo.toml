[package]
name = "woofi_jupiter"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "woofi_jupiter"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
devnet = []

[dependencies]
anchor-lang = "1.0.0"
solana-account = "4.3.1"
solana-clock = "3.0.1"
solana-instruction = "3.4.0"
solana-program-pack = "3.1.0"
solana-pubkey = "4.2.0"
solana-sha256-hasher = "3.1.0"
jupiter-amm-interface = { version = ">=1.0.0-beta.0, <2" }
anyhow = "1.0"
serde = "1.0.210"
serde_json = "1.0.128"
pyth-solana-receiver-sdk = "0.6.1"
spl-token-interface = "2.0.0"
thiserror = "1.0"
bincode = "1.3.3"
tokio = { version = "1.14.1", features = ["full"] }

[dev-dependencies]
solana-client = "4.1.2"

[patch.crates-io]
pyth-solana-receiver-sdk = { git = "https://github.com/jup-ag/pyth-crosschain.git", rev = "2e59227b9b618277e9dcc49c2182058f38443f98" }
pyth-sdk = { git = "https://github.com/jup-ag/pyth-sdk-rs.git", rev = "3f7160bec935bf1698b20b1a3ecfa86b9eec6e1b" }
pyth-sdk-solana = { git = "https://github.com/jup-ag/pyth-sdk-rs.git", rev = "3f7160bec935bf1698b20b1a3ecfa86b9eec6e1b" }
